model:
  in_dim: 1461078
  out_dim: 1
  hidden_sizes:
  - 128
  - 64
  activation: leaky_relu
  dropout: 0.0
trainer:
  batch_size: 32
  patience: 3
  min_epochs: 3
  max_epochs: 6
  lr_rate: 0.001
  optimizer: adam
  optimizer_params:
    betas:
    - 0.99
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.0
  loss: bce
  loss_params:
    pos_weight: 9.0
adversarial_trainer:
  perturbation_scheme: accumulate
  m: 1
  classes_to_perturb:
  - 1
  delta_type: discrete
  delta_bound: 0
  feat_selection: topk
distillation:
  distillation: 0.4
smoothing:
  smoothing: 0.0
